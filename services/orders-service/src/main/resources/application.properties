server.port=8080
spring.application.name=orders-service

# Default is for local dev outside Docker (e.g. running `mvn spring-boot:run`
# for both services directly on the host, using different host ports).
# Overridden in docker-compose.yml via the INVENTORY_SERVICE_URL
# environment variable, which Spring Boot's relaxed binding maps onto
# this property automatically (INVENTORY_SERVICE_URL -> inventory.service.url)
# -- to the Docker Compose service name, e.g. http://inventory-service:8080,
# since containers on the same Compose network resolve each other by
# service name, not localhost.
inventory.service.url=http://localhost:8081
