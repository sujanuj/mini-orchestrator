# Example orchestrator spec. Images referenced here are the exact ones
# `docker compose build` produces from services/inventory-service and
# services/orders-service (Phase 1) -- confirm the exact names on your
# machine with `docker images | grep mini-orchestrator` before running
# this, since Compose derives image names from the parent directory
# name, which can vary.

services:
  - name: inventory-service
    image: mini-orchestrator-inventory-service:latest
    replicas: 3
    containerPort: 8080
    healthPath: /health
    env: {}

  - name: orders-service
    image: mini-orchestrator-orders-service:latest
    replicas: 1
    containerPort: 8080
    hostPort: 8090
    healthPath: /health
    env:
      INVENTORY_SERVICE_URL: http://inventory-service:8080
